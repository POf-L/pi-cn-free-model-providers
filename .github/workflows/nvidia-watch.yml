name: nvidia-model-watch

# NVIDIA NIM 的目录漂移（下线/改名）在运行时已由扩展的 filterToLive 覆盖 ——
# 其 /v1/models 匿名可查，pi 每次启动都会自动剔除消失的模型。本工作流补的是
# 运行时感知不到的两类失效（2026-08 实测均真实发生）：
#   1) 在册但不可用：openai/gpt-oss-120b 连续读超时，却仍留在目录列表里；
#   2) 在册但免费账号无权限：moonshotai/kimi-k2.6 目录在列，补全请求返回
#      404 "Not found for account"（需付费权益）。
# 做法：匿名拉目录兜底比对 + 用仓库密钥对每个在册模型发一次微型流式探活，
# 429 重试一次，其余失败直接记录，最终汇总自动开 issue。每周约 6 次请求，
# 相对 10k/天额度可忽略。需在仓库 Settings → Secrets 配置 NVIDIA_NIM_API_KEY；
# 未配置时退化为纯目录比对模式。

on:
  schedule:
    - cron: "11 4 * * 1" # 每周一 04:11 UTC（错开 siliconflow 03:23 / cloudflare 03:47）
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract curated nvidia model ids
        run: |
          awk '/^const NVIDIA_MODELS/,/^\];/' pi-opencode-native-ext.mjs \
            | grep -o 'id: "[^"]*"' | cut -d'"' -f2 > /tmp/curated.txt
          echo "在册模型 $(wc -l < /tmp/curated.txt) 个:"
          cat /tmp/curated.txt

      - name: Detect curated models removed from anonymous catalog
        run: |
          curl -fsSL --max-time 60 \
            "https://integrate.api.nvidia.com/v1/models" \
            | grep -o '"id":"[^"]*"' | cut -d'"' -f4 | sort -u > /tmp/live.txt
          echo "官方目录 $(wc -l < /tmp/live.txt) 个模型"
          : > /tmp/gone.txt
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            grep -qxF -- "$id" /tmp/live.txt || printf '%s\n' "$id" >> /tmp/gone.txt
          done < /tmp/curated.txt
          echo "从官方目录消失 $(grep -c . /tmp/gone.txt || true) 个:"
          cat /tmp/gone.txt

      - name: Probe each curated model with a tiny streaming request
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
        run: |
          : > /tmp/unhealthy.txt
          if [ -z "$NVIDIA_NIM_API_KEY" ]; then
            echo "未配置 NVIDIA_NIM_API_KEY secret，跳过探活（仅目录比对）"
            exit 0
          fi
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            status=""
            for attempt in 1 2; do
              body=$(printf '{"model":"%s","messages":[{"role":"user","content":"Say OK."}],"max_tokens":32,"stream":true,"temperature":0}' "$id")
              set +e
              http=$(curl -o /tmp/probe.out -sS --max-time 90 -w '%{http_code}' \
                -H "Authorization: Bearer $NVIDIA_NIM_API_KEY" \
                -H "Content-Type: application/json" \
                -H "Accept: text/event-stream" \
                -d "$body" \
                "https://integrate.api.nvidia.com/v1/chat/completions")
              rc=$?
              set -e
              if [ "$rc" -ne 0 ]; then
                status="curl-error-$rc" # rc=28 即读超时
              elif [ "$http" = "200" ]; then
                # 有任一非空 content/reasoning_content 片段才算健康
                if grep -q '"content":"' /tmp/probe.out || grep -q '"reasoning_content":"' /tmp/probe.out; then
                  status="OK"
                else
                  status="EMPTY(200-无输出)"
                fi
                break
              elif [ "$http" = "429" ] && [ "$attempt" = "1" ]; then
                echo "$id 触发 429，20s 后重试"
                sleep 20
                continue
              else
                status="HTTP-$http" # 404/403=无权限、5xx=服务端故障
                break
              fi
            done
            echo "$id -> ${status:-UNKNOWN}"
            if [ -n "$status" ] && [ "$status" != "OK" ]; then
              printf '%s\t%s\n' "$id" "$status" >> /tmp/unhealthy.txt
            fi
          done < /tmp/curated.txt
          echo "--- 探活失败 $(grep -c . /tmp/unhealthy.txt || true) 个 ---"
          cat /tmp/unhealthy.txt

      - name: Open issue when models are gone or unhealthy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gone=$(grep -c . /tmp/gone.txt 2>/dev/null || true)
          bad=$(grep -c . /tmp/unhealthy.txt 2>/dev/null || true)
          if [ "${gone:-0}" = "0" ] && [ "${bad:-0}" = "0" ]; then
            echo "全部正常，无需开 issue"
            exit 0
          fi
          {
            printf '周期巡检发现 NVIDIA NIM 在册模型异常（%s）。\n\n' "$(date +%F)"
            if [ "${gone:-0}" != "0" ]; then
              printf '## 从官方目录消失（运行时 filterToLive 已自动剔除，请清理代码与文档）\n\n```\n%s\n```\n\n' "$(cat /tmp/gone.txt)"
            fi
            if [ "${bad:-0}" != "0" ]; then
              printf '## 探活失败（仍在目录但不可用 —— 运行时无法感知，请人工核验处置）\n\n| 模型 | 状态 |\n|---|---|\n'
              while IFS="$(printf '\t')" read -r id st; do
                printf '| `%s` | %s |\n' "$id" "$st"
              done < /tmp/unhealthy.txt
              printf '\n'
            fi
            printf '参考：\n- 目录查询: `GET https://integrate.api.nvidia.com/v1/models`（匿名可访问）\n- 免费限额: 40 RPM + 10,000 次/天（每日重置）\n- 更新位置: `NVIDIA_MODELS`（pi-opencode-native-ext.mjs）、README NVIDIA 小节、模型对比表、场景矩阵\n'
          } > /tmp/body.md
          gh issue create \
            --title "⚠️ NVIDIA 在册模型巡检异常 ($(date +%F))" \
            --body-file /tmp/body.md
